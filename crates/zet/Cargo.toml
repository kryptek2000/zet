[package]
name = "zet"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "zet"
path = "src/lib.rs"

[[bin]]
name = "zet"
path = "src/main.rs"

[dependencies]
zet-agent = { path = "../zet-agent" }
zet-models = { path = "../zet-models" }
zet-blocks = { path = "../zet-blocks" }
zet-pty = { path = "../zet-pty" }
zet-context = { path = "../zet-context" }
zet-policy = { path = "../zet-policy" }
zet-gpu = { path = "../zet-gpu" }
zet-suggest = { path = "../zet-suggest" }
zet-term = { path = "../zet-term" }
winit = "0.30"
pollster = "1"
arboard = "3"
notify-rust = "4"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["term", "signal", "fs"] }
