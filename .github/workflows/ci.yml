name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    # Any base branch: feature branches stack on each other (e.g. a red-team
    # branch based on the models branch), and a base-filtered trigger left
    # those PRs with no checks at all.
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh (needed for zet-pty zsh integration test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace
